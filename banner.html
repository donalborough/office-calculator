<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0e1c2b;}
  .material-symbols-outlined{
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    display:inline-block;vertical-align:middle;
  }
  @keyframes glow-pulse{
    0%  {box-shadow:0 0 5px rgba(193,241,0,.4),0 0 0 rgba(193,241,0,.2);transform:scale(1);}
    50% {box-shadow:0 0 22px rgba(193,241,0,.75),0 0 10px rgba(193,241,0,.4);transform:scale(1.04);}
    100%{box-shadow:0 0 5px rgba(193,241,0,.4),0 0 0 rgba(193,241,0,.2);transform:scale(1);}
  }
  .glow{animation:glow-pulse 2s infinite ease-in-out;}
</style>
</head>
<body>
<div style="width:640px;background:#0e1c2b;display:flex;flex-direction:row;align-items:center;
            justify-content:space-between;padding:10px 22px;gap:12px;position:relative;overflow:visible;">

  <!-- Background gradient -->
  <div style="position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at top right,rgba(193,241,0,.12),transparent 60%),
               linear-gradient(to bottom right,#0e1c2b,#1a2a3a);"></div>

  <!-- Dot grid accent -->
  <div style="position:absolute;right:0;top:0;width:180px;height:100%;opacity:.03;pointer-events:none;
    background-image:radial-gradient(circle,#c1f100 1.5px,transparent 1.5px);
    background-size:24px 24px;"></div>

  <!-- Logo -->
  <div style="position:relative;z-index:10;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <div style="background:#c1f100;padding:8px;border-radius:8px;display:flex;align-items:center;
                justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);">
      <span class="material-symbols-outlined" style="color:#0e1c2b;font-size:22px;">calculate</span>
    </div>
    <span style="font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;
                 letter-spacing:-.5px;color:#fff;">DealIQ</span>
  </div>

  <!-- Center text -->
  <div style="position:relative;z-index:10;flex:1;text-align:center;padding:0 16px;">
    <div style="font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;
                color:#fff;white-space:nowrap;line-height:1.3;margin-bottom:4px;">
      Calculate your office costs in seconds
    </div>
    <div style="font-family:'Inter',sans-serif;font-size:10.5px;color:#8b99ac;
                font-weight:500;letter-spacing:.3px;">
      Compare properties <span style="opacity:.5;margin:0 4px;">·</span> see real monthly costs
    </div>
  </div>

  <!-- CTA -->
  <div style="position:relative;z-index:10;flex-shrink:0;">
    <a href="https://dealiq.co.il" target="_blank" class="glow"
       style="background:#c1f100;padding:10px 20px;border-radius:9999px;
              border:1px solid rgba(193,241,0,.35);text-decoration:none;
              display:flex;align-items:center;gap:8px;">
      <span style="font-family:'Manrope',sans-serif;font-weight:800;font-size:11.5px;
                   letter-spacing:.8px;text-transform:uppercase;color:#0e1c2b;
                   white-space:nowrap;">Try it free</span>
      <span class="material-symbols-outlined" style="color:#0e1c2b;font-size:18px;">arrow_forward</span>
    </a>
  </div>

</div>
</body>
</html>
