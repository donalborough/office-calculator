<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-primary-container":       "#8b99ac",
          "secondary-container":        "#c1f100",
          "secondary-fixed":            "#abd600",
          "on-secondary-container":     "#546b00",
          "outline-variant":            "#c6c5d4",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body":     ["Inter"],
        },
      },
    },
  }
</script>
<style>
  /* zero out all body whitespace */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0e1c2b; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    display: inline-block;
    vertical-align: middle;
  }

  @keyframes glow-pulse {
    0%   { box-shadow: 0 0 5px  rgba(193,241,0,.4), 0 0 0   rgba(193,241,0,.2); transform: scale(1);    }
    50%  { box-shadow: 0 0 22px rgba(193,241,0,.75),0 0 10px rgba(193,241,0,.4); transform: scale(1.05); }
    100% { box-shadow: 0 0 5px  rgba(193,241,0,.4), 0 0 0   rgba(193,241,0,.2); transform: scale(1);    }
  }
  .animate-glow-pulse { animation: glow-pulse 2s infinite ease-in-out; }
</style>
</head>

<body>
<div class="bg-[#0e1c2b] flex flex-row items-center justify-between relative overflow-hidden"
     style="width:600px; padding:18px 24px; gap:12px;">

  <!-- Background texture -->
  <div class="absolute inset-0 pointer-events-none"
       style="background: radial-gradient(circle at top right, rgba(193,241,0,.12), transparent 60%),
                          linear-gradient(to bottom right, #0e1c2b, #1a2a3a);"></div>

  <!-- Dot grid accent -->
  <div class="absolute right-0 top-0 h-full pointer-events-none"
       style="width:180px; opacity:.03;
              background-image: radial-gradient(circle, #c1f100 1.5px, transparent 1.5px);
              background-size: 24px 24px;"></div>

  <!-- Logo -->
  <div class="relative z-10 flex items-center gap-3 shrink-0">
    <div class="bg-secondary-container p-2.5 rounded-lg flex items-center justify-center"
         style="box-shadow: 0 4px 12px rgba(0,0,0,.2);">
      <span class="material-symbols-outlined text-[#0e1c2b] text-2xl">calculate</span>
    </div>
    <span class="font-headline font-extrabold text-2xl tracking-tight text-white">DealIQ</span>
  </div>

  <!-- Center: headline + sub -->
  <div class="relative z-10 flex-1 text-center px-6">
    <h1 class="font-headline font-bold text-white leading-tight mb-1 whitespace-nowrap" style="font-size:15px;">
      Calculate your office costs in seconds
    </h1>
    <p class="font-body text-[#8b99ac] font-medium tracking-wide" style="font-size:11px;">
      Compare properties <span style="opacity:.5; margin: 0 3px;">·</span> see real monthly costs
    </p>
  </div>

  <!-- CTA -->
  <div class="relative z-10 shrink-0">
    <a href="https://dealiq.co.il" target="_blank"
       class="animate-glow-pulse bg-secondary-container hover:bg-secondary-fixed transition-all duration-300 flex items-center gap-3 group"
       style="padding: 10px 20px; border-radius: 9999px; border: 1px solid rgba(193,241,0,.3); text-decoration:none;">
      <span class="font-headline font-extrabold tracking-widest uppercase text-on-secondary-container" style="font-size:12px;">Try it free</span>
      <span class="material-symbols-outlined text-on-secondary-container text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
    </a>
  </div>

</div>
</body>
</html>
