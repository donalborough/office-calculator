<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-primary-container": "#8b99ac",
          "secondary-container":  "#c1f100",
          "secondary-fixed":      "#abd600",
          "on-secondary-container": "#546b00",
          "outline-variant":      "#c6c5d4",
          "primary":              "#0e1c2b",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body":     ["Inter"],
        },
        borderRadius: { "xl": "0.5rem", "full": "9999px" },
      },
    },
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    display: inline-block;
    vertical-align: middle;
  }

  @keyframes glow-pulse {
    0%   { box-shadow: 0 0 5px  rgba(193,241,0,.4), 0 0 0px  rgba(193,241,0,.2); transform: scale(1);    }
    50%  { box-shadow: 0 0 20px rgba(193,241,0,.7), 0 0 10px rgba(193,241,0,.4); transform: scale(1.05); }
    100% { box-shadow: 0 0 5px  rgba(193,241,0,.4), 0 0 0px  rgba(193,241,0,.2); transform: scale(1);    }
  }
  .animate-glow-pulse { animation: glow-pulse 2s infinite ease-in-out; }
</style>
</head>
<body>

<div style="max-width:720px; border-radius:12px; overflow:hidden; border:1px solid rgba(198,197,212,.15); box-shadow:0 8px 32px rgba(0,0,0,.25);">
  <div style="background:#0e1c2b; display:flex; align-items:center; justify-content:space-between; padding:28px 32px; gap:24px; position:relative; overflow:hidden; flex-wrap:wrap;">

    <!-- Background gradient -->
    <div style="position:absolute; inset:0; background:radial-gradient(circle at top right, rgba(193,241,0,.12), transparent 60%), linear-gradient(to bottom right, #0e1c2b, #1a2a3a); pointer-events:none;"></div>

    <!-- Dot grid accent -->
    <div style="position:absolute; right:0; top:0; width:180px; height:100%; opacity:.03; pointer-events:none; background-image:radial-gradient(circle, #c1f100 1.5px, transparent 1.5px); background-size:24px 24px;"></div>

    <!-- Left: Logo -->
    <div style="position:relative; z-index:10; display:flex; align-items:center; gap:12px; flex-shrink:0;">
      <div style="background:#c1f100; padding:10px; border-radius:8px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.2);">
        <span class="material-symbols-outlined" style="color:#0e1c2b; font-size:24px;">calculate</span>
      </div>
      <span style="font-family:'Manrope',sans-serif; font-weight:800; font-size:22px; color:#fff; letter-spacing:-.3px;">DealIQ</span>
    </div>

    <!-- Center: Headline -->
    <div style="position:relative; z-index:10; flex:1; min-width:180px; text-align:center;">
      <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:17px; color:#fff; line-height:1.3; margin-bottom:6px; white-space:nowrap;">
        Calculate your office costs in seconds
      </div>
      <div style="font-family:'Inter',sans-serif; font-size:12px; color:#8b99ac; letter-spacing:.4px; line-height:1.8;">
        Compare properties &nbsp;·&nbsp; see real monthly costs<br>
        <strong style="color:#a0b0c0;">dealiq.co.il</strong>
      </div>
    </div>

    <!-- Right: CTA -->
    <div style="position:relative; z-index:10; flex-shrink:0;">
      <a href="https://dealiq.co.il"
         target="_blank"
         class="animate-glow-pulse"
         style="background:#c1f100; border:1px solid rgba(193,241,0,.3); padding:12px 28px; border-radius:9999px; display:inline-flex; align-items:center; gap:10px; text-decoration:none; transition:background .3s;">
        <span style="font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; color:#1a2a00; letter-spacing:.8px; text-transform:uppercase;">Try it free</span>
        <span class="material-symbols-outlined" style="color:#1a2a00; font-size:18px; font-weight:700;">arrow_forward</span>
      </a>
    </div>

  </div>
</div>

</body>
</html>
